# Habblaud Hub tunnels: one line per remote office.
#
#   <localPort> <user>@<host>[:<sshPort>] [remotePort]
#
# localPort   port on this computer (127.0.0.1) where the office appears; compose.yml publishes 4801-4810.
# user@host   SSH login on the machine running that office (a mesh/VPN address is ideal); sshPort defaults to 22.
# remotePort  where Habblaud listens on that machine's loopback; defaults to 4747.
#
# Then add the office to config.json as "url": "http://localhost:<localPort>".
4801 user@100.64.0.1
4802 user@100.64.0.2
# 4803 user@server-3.example.internal:2222 4747
