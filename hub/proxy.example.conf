# Optional name-based proxy: open the hub and each office by name instead of localhost:<port>.
#
#   cp proxy.example.conf proxy.conf      # then edit the names and upstreams below
#   docker compose -f hub/compose.yml --profile proxy up -d
#
# Use names under .localhost: browsers always resolve them to the loopback (no DNS, no rebinding), treat them as
# secure contexts (the PWA keeps working) and Habblaud treats them as local access (terminal, approvals, messages).
# Add each office's origin to its HABBLAUD_FRAME_ANCESTORS (e.g. http://habblaud.localhost) and use the names in
# config.json. Published on 127.0.0.1:80 only.

map $http_upgrade $proxy_connection_upgrade {
    default upgrade;
    ''      close;
}

# Name -> upstream. "hub" and "tunnels" are the other services of this compose file; host.docker.internal is the
# machine Docker runs on (the local Habblaud from `npm run docker:up`).
map $host $office_upstream {
    hostnames;
    default                          "";
    habblaud.localhost               hub:8080;
    laptop.habblaud.localhost        host.docker.internal:4747;
    server1.habblaud.localhost       tunnels:4801;
    server2.habblaud.localhost       tunnels:4802;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    # Unknown names get nothing.
    if ($office_upstream = "") {
        return 421;
    }

    location / {
        # Resolve upstream names at request time (Docker's DNS), so a stopped service doesn't stop the proxy.
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$office_upstream;
        proxy_http_version 1.1;
        # Keep the browser's Host: Habblaud checks it (*.localhost counts as local access).
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $proxy_connection_upgrade;
        # Live updates are Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 8m;
    }
}
