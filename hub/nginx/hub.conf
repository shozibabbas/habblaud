# Habblaud Hub: static files only. Listens on 8080 inside the container (non-root nginx);
# compose publishes it on 127.0.0.1 only.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Only loopback names (localhost, *.localhost, 127.0.0.1, [::1]): a DNS-rebinding page can't read the hub (or its
    # config) through another name. Browsers always resolve *.localhost to the loopback.
    if ($host !~* ^(localhost|([a-z0-9-]+\.)+localhost|127\.0\.0\.1|\[::1\])$) {
        return 421;
    }

    include /etc/nginx/hub/headers.conf;

    location = /sw.js {
        include /etc/nginx/hub/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /config.json {
        include /etc/nginx/hub/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/hub/headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/hub/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/hub/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
