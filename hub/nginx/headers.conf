# Security headers for every hub response (repeated in each location: add_header there replaces the server's).
#
# frame-src / connect-src: the offices are only ever reached on this machine's loopback (directly or through the
# SSH tunnels container), so the hub may frame and probe http://localhost:*, http://127.0.0.1:* and http://*.localhost (the optional name-based
# proxy, see proxy.example.conf) and nothing else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* http://*.localhost http://*.localhost:*; frame-src http://localhost:* http://127.0.0.1:* http://*.localhost http://*.localhost:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
